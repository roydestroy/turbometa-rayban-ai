name: Android APK and tests
on:
  push:
    branches: [main, fix/vosk-audio-lifecycle]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build ARM64 and universal APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash gradlew --no-configuration-cache --max-workers=2 :app:testDebugUnitTest :app:assembleDebug
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: TurboMeta-free-wake-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
